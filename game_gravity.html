<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>星落 STARFALL · 2048</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link href="style/ui.css" rel="stylesheet" type="text/css">
  <link href="style/gravity.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="console">

    <header class="cli-bar">
      <a class="back-link" href="index.html">← 返回</a>
      <span class="cli-sys">MODE.2048 // STARFALL</span>
    </header>

    <section class="callout">
      <h1 class="tag">STARFALL <span class="cn">星落</span></h1>
      <p class="lede">你不推它，你倾斜它。<b>转动这颗星</b>，让重力替你把瓦片坠到底、连锁合体。</p>
    </section>

    <section class="telemetry">
      <div class="gauge">
        <span class="gauge-label">SCORE 分数</span>
        <span class="gauge-num" id="grav-score">0</span>
      </div>
      <div class="gauge dim">
        <span class="gauge-label">BEST 最佳</span>
        <span class="gauge-num" id="grav-best">0</span>
      </div>
      <div class="combo-wrap">
        <span class="combo" id="grav-combo"></span>
      </div>
    </section>

    <section class="starpit">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="board" id="board-grav"></div>
      <div class="core" aria-hidden="true"></div>
    </section>

    <div class="readout">
      <span class="readout-arrow" id="compass">重力 ↓</span>
    </div>

    <div class="msg" id="grav-msg"></div>

    <p class="manual">
      <b>←→</b> / 左右拖动 转向 · <b>SPACE</b> / 轻点 坠落<br>
      <span class="fine">同数一路连锁合体，连击加分更多</span><br>
      <a class="how-link" href="#" id="how-link">如何操作？</a>
    </p>

    <!-- 首次进入 -->
    <div class="howto" id="howto">
      <div class="howto-card">
        <h2>STARFALL</h2>
        <p>转动星球让重力替你坠：同数相撞会<b>连锁合体</b>，越连越赚分。</p>
        <ul>
          <li><b>转向</b>：←→ 或左右拖动 · 屏幕下方即重力方向</li>
          <li><b>坠落</b>：SPACE 或轻点 · 落到底自动链合</li>
          <li>目标：合成 <b>2048</b></li>
        </ul>
        <button class="howto-ok" id="howto-ok">进入星落</button>
      </div>
    </div>

  </div>

  <script src="js/swipe.js"></script>
  <script src="js/gravity2048.js"></script>
  <script>
    window.OrbitGame && window.OrbitGame();
  </script>
</body>
</html>
