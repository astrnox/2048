<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>观星台 · 星球引力</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link href="style/gravity.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="scope">

    <header class="rise-head">
      <a class="home-link" href="index.html">← 回首页</a>
      <span class="latin">ORBIT ✦ 2048</span>
    </header>

    <div class="plate">
      <h1 class="headline">星·落</h1>
      <p class="lede">你不推它，你倾斜它。<br>拖拽重力，让瓦片坠落、合体。</p>

      <div class="compass">
        <span class="compass-arrow" id="compass-arrow">↓</span>
        <span class="compass-txt" id="compass">重力 ↓</span>
      </div>

      <!-- 星球罗盘：轨道圈内嵌 4×4 落体场 -->
      <div class="planet">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="board" id="board-grav"></div>
        <div class="core" aria-hidden="true"></div>
      </div>

      <div class="readout">
        <div class="meter"><span class="label">分数</span><span class="num" id="grav-score">0</span></div>
        <div class="meter best"><span class="label">星等最佳</span><span class="num" id="grav-best">0</span></div>
      </div>

      <div class="msg" id="grav-msg"></div>

      <p class="manual">
        <b>←→</b> / 左右拖动 转动这颗星 · <b>Space</b> / 轻点 坠落<br>
        <span class="fine">轻点坠落 · 左右拖动旋转 · 向下拖动也坠落</span><br>
        <a class="how-link" href="#" id="how-link">如何玩？⼀</a>
      </p>
    </div>

    <!-- 首次进入的玩法引导 -->
    <div class="howto" id="howto">
      <div class="howto-card">
        <h2>这是「星球引力」</h2>
        <p>你真不推瓦片——你<b>转动这颗星</b>，让重力替你坠。</p>
        <ul>
          <li><b>转动</b>：←→ 或左右拖动，改变重力方向（屏幕下方即重力方向）</li>
          <li><b>坠落</b>：Space 或轻点，瓦片落到底、相同数字合体</li>
          <li>目标：合成 <b>2048</b></li>
        </ul>
        <button class="howto-ok" id="howto-ok">开始观测</button>
      </div>
    </div>

  </div>

  <script src="js/swipe.js"></script>
  <script src="js/gravity2048.js"></script>
  <script>
    window.OrbitGame && window.OrbitGame();
  </script>
</body>
</html>
