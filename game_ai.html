<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2048 · 人机对抗</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link href="style/ui.css" rel="stylesheet" type="text/css">
  <link href="style/ai.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="container">

    <header class="cli-bar">
      <a class="back-link" href="index.html">← 返回</a>
      <span class="cli-sys">人机对抗</span>
    </header>

    <header class="stage-head">
      <h1 class="title">人机对抗</h1>
      <p class="subtitle">你和电脑各执一盘、<b>轮流走子</b>，谁先合成 <b>2048</b> 谁赢</p>
    </header>

    <div class="race-info">
      <div class="effort">
        <span class="rate-dot you"></span><span>你的步数由你掌控</span>
      </div>
      <div class="clock">
        <span class="clock-label">⌛ 本局用时</span>
        <span class="clock-main" id="race-timer">0:00</span>
      </div>
      <div class="effort">
        <span class="rate-dot bot"></span><span>电脑与你轮流走子</span>
      </div>
    </div>

    <div class="arena">
      <section class="side you">
        <div class="side-head">
          <span class="side-badge">你</span>
          <div class="side-stats">
            <div class="stat"><span class="stat-num" id="score-p">0</span><span class="stat-label">得分</span></div>
            <div class="stat"><span class="stat-num golden" id="merges-p">+0</span><span class="stat-label">合成</span></div>
          </div>
        </div>
        <div class="board" id="board-p"></div>
        <div class="combo-wrap"><span class="combo" id="ai-combo"></span></div>
        <p class="side-key">方向键 / WASD 控制左边的棋盘</p>
      </section>

      <div class="vs">VS</div>

      <section class="side bot">
        <div class="side-head">
          <div class="side-stats right">
            <div class="stat"><span class="stat-num" id="score-b">0</span><span class="stat-label">得分</span></div>
            <div class="stat"><span class="stat-num golden" id="merges-b">+0</span><span class="stat-label">合成</span></div>
          </div>
          <span class="side-badge bot">电脑</span>
        </div>
        <div class="board" id="board-b"></div>
        <p class="side-key" id="ai-status">你的回合</p>
      </section>
    </div>

    <div class="sabot-bar">
      <p class="sabot-title"><span>捣乱技能点</span> <b id="sabot-pts">×0</b></p>
      <div class="sabot-controls">
        <button type="button" class="diff-btn" id="sabot-btn" disabled>捣乱 ×0</button>
        <button type="button" class="diff-btn" id="sabot-auto">自动插桩</button>
        <button type="button" class="diff-btn" id="sabot-val">放 2</button>
        <button type="button" class="diff-btn" id="sabot-cancel">取消</button>
      </div>
      <p class="sabot-hint" id="sabot-hint">每完成一轮双方各 +1 点 · 攒 1 点可主动在电脑棋盘放一个 2/4（可跳过）</p>
    </div>

    <div class="banner" id="banner">
      <span class="banner-text" id="banner-text"></span>
      <button class="btn btn-primary" id="replay">再战一局</button>
    </div>

    <div id="diff-slot" class="diff-slot"></div>

    <div id="settings-slot" class="diff-slot"></div>

    <p class="game-note">双方轮流走子：你走一步，电脑走一步。<b>捣乱技能点</b>：每完成一轮双方各获得 1 点，攒够 1 点可以自愿在对方棋盘放一个 2 或 4。<b>地狱</b>：电脑会盯准你的落点出手，步步紧逼。</p>

  </div>

  <script src="js/swipe.js"></script>
  <script src="js/assist.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/ai2048.js"></script>
  <script>
    var _duel = window.AiDuel && window.AiDuel();
    window.Sound && Sound.mount('settings-slot', { label: '音效' });
    window.Assist && Assist.mount('diff-slot', {
      label: '电脑难度', key: '2048-botdiff', def: 'normal',
      options: [['easy', '简单'], ['normal', '普通'], ['hard', '困难'], ['hell', '地狱']],
      onchange: function () { if (_duel) _duel.newRound(); }
    });
  </script>
</body>
</html>
