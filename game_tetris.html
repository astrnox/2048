<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2048＋ · 方块</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link href="style/ui.css" rel="stylesheet" type="text/css">
  <link href="style/tetris.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="console">
    <header class="cli-bar">
      <a class="back-link" href="index.html">← 返回</a>
      <span class="cli-sys">MODE.2048 // TETRIS</span>
    </header>

    <header class="callout">
      <h1 class="tag">方块<span class="cn">TETRIS 2048</span></h1>
      <p class="lede">一块数字落下，<b>左右移动</b>对齐，<b>落地</b>与同列同数合成（2048 式）。叠满即止，冲击 <b>2048</b>。</p>
    </header>

    <div class="telemetry">
      <div class="gauge"><span class="gauge-label">得分</span><span class="gauge-num" id="tt-score">0</span></div>
      <div class="gauge"><span class="gauge-label">最佳</span><span class="gauge-num" id="tt-best">0</span></div>
    </div>

    <div class="board" id="board-tt"></div>

    <div class="msg" id="tt-msg"></div>

    <div id="settings-slot" class="diff-slot"></div>

    <p class="manual">
      <b>← →</b> 左右移动 · <b>↓ / 空格</b> 硬着陆<br>
      <span class="fine">手机：左右滑动移动，向下滑动硬着陆</span><br>
      <span class="fine">落地后同列同数会自动合成并坍缩，目标 <b>2048</b></span>
    </p>
  </div>

  <script src="js/swipe.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/tetris2048.js"></script>
  <script>
    window.TetrisGame && new window.TetrisGame(document.getElementById("board-tt"));
    window.Sound && Sound.mount('settings-slot', { label: '音效' });
  </script>
</body>
</html>
