<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F5F0E6">
<title>2048＋ · 2048 Plus</title>
<link rel="stylesheet" href="style/spa.css">
</head>
<body>

  <!-- 应用主容器：三视图切换 -->
  <div id="app" class="app">

    <!-- ====== 视图 1：首页 ====== -->
    <section class="view view-home is-active" data-view="home">
      <div class="stage">
        <div class="brand">
          <h1 class="logo-2048" aria-label="2048 Plus"><span class="logo-num">2048</span><span class="logo-plus">＋</span></h1>
          <p class="logo-sub">2048 PLUS</p>
        </div>
        <nav class="btn-stack">
          <button class="btn-3d" data-go="modes" data-ripple>开始游戏</button>
          <button class="btn-3d" data-go="settings" data-ripple>排行榜</button>
          <button class="btn-3d" data-go="settings" data-ripple>设置</button>
          <button class="btn-3d" data-go="quit" data-ripple>退出游戏</button>
        </nav>
      </div>
    </section>

    <!-- ====== 视图 2：模式选择 ====== -->
    <section class="view view-modes" data-view="modes" aria-hidden="true">
      <div class="stage">
        <div class="brand">
          <h1 class="logo-2048"><span class="logo-num">2048</span><span class="logo-plus">＋</span></h1>
          <p class="logo-sub">2048 PLUS</p>
        </div>
        <nav class="btn-stack">
          <button class="btn-3d" data-play="classic" data-ripple>经典模式</button>
          <button class="btn-3d" data-play="gravity" data-ripple>星落模式</button>
          <button class="btn-3d" data-play="hex"     data-ripple>六边模式</button>
          <button class="btn-3d" data-play="ai"      data-ripple>对抗模式</button>
          <button class="btn-3d" data-play="quantum" data-ripple>量子模式</button>
          <button class="btn-3d" data-play="tetris"  data-ripple>方块模式</button>
          <button class="btn-3d" data-play="dive"    data-ripple>整除模式</button>
          <button class="btn-3d btn-3d-muted" data-back="home" data-ripple>返回菜单</button>
        </nav>
      </div>
    </section>

    <!-- ====== 视图 3：子菜单（新游戏 / 继续游戏） ====== -->
    <section class="view view-play" data-view="play" aria-hidden="true">
      <div class="stage">
        <div class="brand">
          <h1 class="logo-2048"><span class="logo-num">2048</span><span class="logo-plus">＋</span></h1>
          <p class="logo-sub">2048 PLUS</p>
        </div>
        <div class="mode-chip" id="modeChip">经典模式</div>
        <nav class="btn-stack">
          <button class="btn-3d" id="btnNewGame" data-ripple>新游戏</button>
          <button class="btn-3d" id="btnContinue" data-ripple>继续游戏</button>
          <button class="btn-3d btn-3d-muted" data-back="modes" data-ripple>返回</button>
        </nav>
      </div>
    </section>

  </div>

  <!-- 底部版本号 -->
  <div class="app-foot" aria-hidden="true">V1.0.0</div>

  <!-- ====== 确认框：覆盖层 ====== -->
  <div class="modal" id="confirmModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-confirm></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 class="modal-title" id="confirmTitle">覆盖存档？</h2>
      <p class="modal-text">当前已有存档，开始新游戏会将其覆盖，是否继续？</p>
      <div class="modal-actions">
        <button class="btn-3d modal-cancel" data-close-confirm data-ripple>取消</button>
        <button class="btn-3d modal-ok"     id="confirmOk"    data-ripple>确认新游戏</button>
      </div>
    </div>
  </div>

<script src="js/spa.js"></script>
</body>
</html>
